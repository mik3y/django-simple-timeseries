[tox]
isolated_build = true
envlist =
    py312-django{42,52,60}-{mysql,postgres,sqlite}
    py313-django{52,60}-{mysql,postgres,sqlite}
    py314-django{52,60}-{mysql,postgres,sqlite}
    dist

[testenv]
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    mysql: mysqlclient
    postgres: psycopg2
    pytest
    pytest-django
    freezegun

commands =
    pytest

envdir = {toxworkdir}/v/{envname}

passenv =
    DJANGO_SETTINGS_MODULE
    PYTHONPATH
    DB_BACKEND
    DB_NAME
    DB_USER
    DB_PASSWORD
    DB_HOST
    DB_PORT
    GITHUB_*

usedevelop = True

[testenv:dist]
commands =
    twine check {envtmpdir}/dist/*
deps =
    twine>=6.1
usedevelop = False
skip_install = true
allowlist_externals = uv
commands_pre =
    uv build --out-dir {envtmpdir}/dist

[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
