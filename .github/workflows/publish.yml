name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub release.
      contents: write
      # Needed to mint the OIDC token PyPI trusted publishing authenticates with.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Create release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Authenticates via OIDC (PyPI trusted publishing), so there is no API
      # token to store. PyPI matches the request against the publisher
      # configured for this repo and this workflow filename.
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
