[project]
name = "django-simple-timeseries"
version = "0.3.0"
description = "Simple timeseries data type and field for Django models."
readme = "README.md"
authors = [{ name = "mike wakerly", email = "opensource@hoho.com" }]
requires-python = ">=3.12,<4"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/mik3y/django-simple-timeseries"
Repository = "https://github.com/mik3y/django-simple-timeseries"
Changelog = "https://github.com/mik3y/django-simple-timeseries/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "tox>=4.17.1,<5",
    "setuptools>=72.1.0,<73",
    "pytest-django>=4.8.0,<5",
    "twine>=6.1,<7",
    "django>=6.0.5",
    "ruff>=0.15.20",
    "freezegun>=1.5.1,<2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = 'py312'
# Lets isort recognize `django_simple_timeseries` as first-party rather than third-party.
src = ["src"]
exclude = [
  ".git",
  "node_modules",
  ".pyenv",
  ".vscode",
  ".tox",
  "migrations"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
